# Phase 3 acceptance demo: three consoles (server, client, logs) in one grid, started in
# parallel. Local and harmless: a Python web server on 127.0.0.1 serving /tmp/sp-web.
#
#   scenarioplay run examples/multi-console.yaml
version: 1
meta:
  title: "Web server, client and logs"

layout: grid
consoles:
  - { name: server, title: "Server" }
  - { name: client, title: "Client" }
  - { name: logs, title: "Access log" }

vars:
  port: 8080
  site: /tmp/sp-web

defaults:
  typing: { profile: normal }
  after_command_pause: 0.8

setup:
  - run: "mkdir -p {{ site }} && cd {{ site }} && echo '<h1>Hello</h1>' > index.html && : > access.log"
    console: server
  - run: "cd {{ site }}"
    console: client
  - run: "cd {{ site }}"
    console: logs

steps:
  - chapter: "Task 1: Start the web server and follow its log"
  - parallel:
      - console: server
        steps:
          - type: "python3 -u -m http.server {{ port }} --bind 127.0.0.1 2>&1 | tee access.log"
            enter: true
            wait_for: { text: "Serving HTTP" }
      - console: logs
        steps:
          - type: "tail -f access.log"
            enter: true
            wait_for: { idle: 1 }
  - wait_for: { port: "{{ port }}", timeout: 15 }

  - chapter: "Task 2: Send requests"
  - use: client
  - for_each: ["/", "/index.html", "/missing"]
    as: path
    steps:
      - run: "curl -s -o /dev/null -w '%{http_code}\\n' http://127.0.0.1:{{ port }}{{ path }}"
  - wait_for: { text: '"GET /missing HTTP/1.1" 404', console: logs, timeout: 10 }
  - caption: "Every request shows up in the access log"
  - focus: logs
    zoom: true
  - pause: 2.5
  - focus: logs
    zoom: false

  - chapter: "Task 3: Stop everything"
  - key: C-c
    console: logs
    wait_for: { prompt: true }
  - key: C-c
    console: server
    wait_for: { prompt: true }

finally:
  - exec: "pkill -f 'http.server {{ port }}' || true"
