name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh ffmpeg xvfb xterm fonts-dejavu-core
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Schema and generated docs are up to date
        run: |
          scenarioplay schema > /tmp/schema.json
          diff -u schema/scenarioplay.schema.json /tmp/schema.json
          scenarioplay gen-docs > /dev/null && git diff --exit-code docs/reference
      - name: Tests (unit, tmux integration, recording under Xvfb)
        env:
          LANG: C.UTF-8
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest -v -rs
