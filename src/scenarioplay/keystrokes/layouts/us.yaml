# US QWERTY. Rows from the number row down; `shift` is the same keys with Shift held.
# `offsets` is how far each row is shifted right, in key widths (the keyboard's stagger).
name: us
rows:
  - "`1234567890-="
  - "qwertyuiop[]\\"
  - "asdfghjkl;'"
  - "zxcvbnm,./"
shift:
  - "~!@#$%^&*()_+"
  - "QWERTYUIOP{}|"
  - "ASDFGHJKL:\""
  - "ZXCVBNM<>?"
offsets: [0, 0.5, 0.75, 1.25]
